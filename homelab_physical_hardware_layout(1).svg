<svg width="380" height="520" viewBox="0 0 380 520" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono, SFMono-Regular, Consolas, Menlo, monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Home lab physical hardware layout</title>
<desc>Coax wall jack feeding the TP-Link Omada router, then the switch, which branches to the access point and the Beelink mini PC, which has a storage dock attached via USB.</desc>

<rect x="0" y="0" width="380" height="520" rx="12" fill="#0b0f0d"/>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#6d8177" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- connectors -->
<line x1="190" y1="84" x2="190" y2="124" stroke="#22302a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="190" y1="180" x2="190" y2="220" stroke="#22302a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="185" y1="276" x2="115" y2="316" stroke="#22302a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="195" y1="276" x2="265" y2="316" stroke="#22302a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="270" y1="372" x2="270" y2="412" stroke="#22302a" stroke-width="1.5" marker-end="url(#arrow)"/>

<text x="150" y="299" text-anchor="middle" font-size="10" fill="#6d8177">PoE</text>
<text x="300" y="396" text-anchor="start" font-size="10" fill="#6d8177">USB</text>

<!-- Coax wall jack -->
<rect x="60" y="40" width="260" height="44" rx="8" fill="rgba(139,148,158,0.08)" stroke="#8b98a0" stroke-width="1"/>
<text x="190" y="62" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#c9d6cf">Coax wall jack</text>

<!-- Router -->
<rect x="60" y="124" width="260" height="56" rx="8" fill="rgba(95,211,157,0.10)" stroke="#5fd39d" stroke-width="1"/>
<text x="190" y="144" text-anchor="middle" font-size="14" font-weight="600" fill="#c9d6cf">Router</text>
<text x="190" y="162" text-anchor="middle" font-size="11" fill="#6d8177">TP-Link ER605 V2 (Omada)</text>

<!-- Switch -->
<rect x="60" y="220" width="260" height="56" rx="8" fill="rgba(95,211,157,0.10)" stroke="#5fd39d" stroke-width="1"/>
<text x="190" y="240" text-anchor="middle" font-size="14" font-weight="600" fill="#c9d6cf">Switch</text>
<text x="190" y="258" text-anchor="middle" font-size="11" fill="#6d8177">TP-Link 8-port (Omada)</text>

<!-- Access point -->
<rect x="40" y="316" width="140" height="56" rx="8" fill="rgba(95,211,157,0.10)" stroke="#5fd39d" stroke-width="1"/>
<text x="110" y="336" text-anchor="middle" font-size="14" font-weight="600" fill="#c9d6cf">Access point</text>
<text x="110" y="354" text-anchor="middle" font-size="11" fill="#6d8177">EAP225 · PoE</text>

<!-- Mini PC -->
<rect x="200" y="316" width="140" height="56" rx="8" fill="rgba(111,179,210,0.10)" stroke="#6fb3d2" stroke-width="1"/>
<text x="270" y="336" text-anchor="middle" font-size="14" font-weight="600" fill="#c9d6cf">Mini PC</text>
<text x="270" y="354" text-anchor="middle" font-size="11" fill="#6d8177">Beelink S12</text>

<!-- Storage dock -->
<rect x="200" y="412" width="140" height="56" rx="8" fill="rgba(111,179,210,0.10)" stroke="#6fb3d2" stroke-width="1"/>
<text x="270" y="432" text-anchor="middle" font-size="14" font-weight="600" fill="#c9d6cf">Storage dock</text>
<text x="270" y="450" text-anchor="middle" font-size="11" fill="#6d8177">SABRENT dual-bay</text>

<!-- legend -->
<circle cx="50" cy="498" r="5" fill="#8b98a0"/>
<text x="62" y="498" text-anchor="start" dominant-baseline="central" font-size="11" fill="#6d8177">ISP-provided</text>
<circle cx="155" cy="498" r="5" fill="#5fd39d"/>
<text x="167" y="498" text-anchor="start" dominant-baseline="central" font-size="11" fill="#6d8177">Network gear</text>
<circle cx="260" cy="498" r="5" fill="#6fb3d2"/>
<text x="272" y="498" text-anchor="start" dominant-baseline="central" font-size="11" fill="#6d8177">Compute</text>
</svg>
